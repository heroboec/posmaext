name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(jq -r .version extension/manifest.json)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match manifest version $VER"
            exit 1
          fi

      - name: Build zip
        run: cd extension && zip -r "../position-matcher-${GITHUB_REF_NAME}.zip" . -x '.*'

      - uses: softprops/action-gh-release@v2
        with:
          files: position-matcher-${{ github.ref_name }}.zip
          generate_release_notes: true
